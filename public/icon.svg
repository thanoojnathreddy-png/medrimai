<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="medisync-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="shadow" x="0" y="8" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18" flood-color="#1e3a8a"/>
    </filter>
  </defs>
  <!-- Background with subtle squircle -->
  <rect width="512" height="512" rx="128" fill="url(#medisync-grad)" />
  
  <!-- Subtle inner radial shine -->
  <circle cx="160" cy="140" r="160" fill="white" opacity="0.12" />

  <!-- Medical Cross & Capsule Icon -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Pill Capsule tilted 45 deg -->
    <g transform="translate(150, 150) rotate(-45)">
      <!-- Left half of pill -->
      <path d="M-90,-45 L0,-45 C25,-45 25,45 0,45 L-90,45 C-115,45 -115,-45 -90,-45 Z" fill="#FFFFFF" />
      <!-- Right half of pill -->
      <path d="M0,-45 L90,-45 C115,-45 115,45 90,45 L0,45 C-25,45 -25,-45 0,-45 Z" fill="#38BDF8" />
      <!-- Center divider ring -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#1E293B" stroke-width="4" opacity="0.15" />
    </g>

    <!-- Sync / Heartbeat ring -->
    <circle cx="150" cy="150" r="120" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="140 60 80 40" opacity="0.9" fill="none" />
    <!-- Pulse dot -->
    <circle cx="270" cy="150" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4" />
  </g>
</svg>
